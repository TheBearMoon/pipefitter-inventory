<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eef1f5" id="themeColorMeta">
  <meta name="description" content="Fast, offline-first inventory tracker built for pipefitters: gaskets, stud bolts, U-bolts, J-bolts, pipe plugs, and valves.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pipefitter">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Pipefitter Inventory</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./base.css?v=45">
  <link rel="stylesheet" href="./style.css?v=45">
</head>
<body>
  <div id="authGate" class="auth-gate hidden" role="dialog" aria-modal="true" aria-label="Sign in">
    <div class="auth-card">
      <img src="./icon-192.png" alt="Pipefitter Inventory" class="auth-logo">
      <h1 class="auth-title">Pipefitter Inventory</h1>
      <p class="auth-sub">Sign in with your crew, supervisor, or admin account to access yard inventory.</p>
      <div class="field">
        <label for="ag-u">Username or Email</label>
        <input id="ag-u" type="text" placeholder="e.g. oniel" autocomplete="username">
      </div>
      <div class="field" id="fg-ag-p">
        <label for="ag-p">Password</label>
        <input id="ag-p" type="password" placeholder="••••••" autocomplete="current-password">
        <div class="field-error" id="ag-err">Invalid username or password.</div>
      </div>
      <button type="button" class="btn btn-primary" style="width:100%" id="ag-submit">Sign in</button>
      <p class="auth-note">Stays signed in automatically when offline. Ask your Main Admin or Supervisor for an account.</p>
    </div>
  </div>
  <a href="#mainContent" class="skip-link">Skip to inventory</a>

  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <img class="brand-mark" src="./icon-192.png" alt="Pipefitter Inventory logo" width="38" height="38">
          <div class="brand-copy">
            <h1 class="brand-title" id="pageTitle">Pipefitter Inventory</h1>
            <div class="brand-sub" id="pageSub">Materials on hand</div>
          </div>
        </div>

        <nav class="desktop-nav" aria-label="Primary navigation">
          <button type="button" data-v="stock" class="is-active" aria-current="page">Stock</button>
          <button type="button" data-v="reorder">Reorder <span class="nav-badge hidden" id="roDotDesktop">0</span></button>
          <button type="button" data-v="activity">Activity</button>
          <button type="button" data-v="tools">Tools</button>
        </nav>

        <div class="topbar-actions">
          <button type="button" class="btn btn-primary desktop-add-btn" id="desktopAddBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Add item
          </button>
          <button type="button" class="icon-btn" id="themeBtn" aria-label="Switch color theme" title="Toggle light/dark mode"></button>
        </div>
      </div>

      <div class="team-bar" id="teamBar">
        <button type="button" class="team-switch-btn" id="teamSwitchBtn" aria-label="Switch active team and Conex box"></button>
        <button type="button" class="team-all-btn" id="teamAllBtn" aria-label="Toggle all teams view">All</button>
        <button type="button" class="team-all-btn team-super-btn hidden" id="superViewBtn" aria-label="Open Admin Super View">Super View</button>
      </div>

      <div class="stock-toolbar" id="stockHead">
        <div class="search-row">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="q" type="search" placeholder="Search part, size, bin…" autocomplete="off" aria-label="Search inventory">
            <button type="button" class="search-clear" id="qClear" aria-label="Clear search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="16" height="16"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
          <button type="button" class="sort-trigger" id="sortBtn" aria-label="Change sort order">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
            <span id="sortLabel">Name</span>
          </button>
        </div>
        <div class="cat-strip" id="pills" role="tablist" aria-label="Material categories"></div>
      </div>
    </header>

    <main id="mainContent">
      <section id="v-stock" class="view-section" aria-label="Stock inventory">
        <div class="status-bar">
          <div class="status-filters" id="statusFilters" role="group" aria-label="Filter by stock status"></div>
          <div class="results-meta" id="listLabel"></div>
        </div>
        <div class="items-grid" id="list"></div>
      </section>

      <section id="v-reorder" class="view-section hidden" aria-label="Reorder list"></section>
      <section id="v-activity" class="view-section hidden" aria-label="Inventory activity"></section>
      <section id="v-tools" class="view-section hidden" aria-label="Tools and settings"></section>
    </main>
  </div>

  <!-- Mobile 5-slot Bottom Navigation Dock (center Add button prevents card overlap) -->
  <nav class="bottom-dock" aria-label="Mobile navigation">
    <div class="dock-inner">
      <button type="button" class="dock-tab is-active" data-v="stock" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5L12 12l9-4.5M12 12v9"/></svg>
        <span>Stock</span>
      </button>
      <button type="button" class="dock-tab" data-v="reorder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 002 1.6h8.2a2 2 0 002-1.5L21 8H6"/><circle cx="10" cy="20.5" r="1.2"/><circle cx="18" cy="20.5" r="1.2"/></svg>
        <span>Reorder</span>
        <span class="nav-badge hidden" id="roDot">0</span>
      </button>
      <button type="button" class="dock-add" id="fab" aria-label="Add new item" title="Add item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button type="button" class="dock-tab" data-v="activity">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7.5L14 19.5l3-7.5h4"/></svg>
        <span>Activity</span>
      </button>
      <button type="button" class="dock-tab" data-v="tools">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        <span>Tools</span>
      </button>
    </div>
  </nav>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="shTitle"></h2>
      <button type="button" class="icon-btn" id="shClose" aria-label="Close dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="shBody"></div>
    <div class="sheet-foot" id="shFoot"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toastMsg"></span>
    <button type="button" class="toast-undo hidden" id="toastUndo">Undo</button>
  </div>

  <input type="file" id="fileIn" accept="application/json,.json" class="hidden" aria-hidden="true">
  <input type="file" id="photoIn" accept="image/*" class="hidden" aria-hidden="true">
  <input type="file" id="libPhotoIn" accept="image/*" class="hidden" aria-hidden="true">

  <script src="./firebase-config.js?v=45" defer></script>
  <script src="./firebase-sync.js?v=45" defer></script>
  <script src="./app.js?v=45" defer></script>
</body>
</html>
