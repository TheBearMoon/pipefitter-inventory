<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pipefitter">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pipefitter Inventory</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f4f6f9;--surface:#fff;--surface2:#eef1f5;--line:#e2e6ec;--text:#0f172a;--muted:#64748b;
  --brand:#1d4ed8;--brand-ink:#fff;--brand-soft:#e0e8fd;
  --ok:#15803d;--ok-soft:#dcfce7;--warn:#b45309;--warn-soft:#fef3c7;--bad:#b91c1c;--bad-soft:#fee2e2;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.05);
  --r:16px;--nav:68px;
  font-synthesis:none;
}
[data-theme=dark]{
  --bg:#0b1120;--surface:#131b2e;--surface2:#1c263b;--line:#26324a;--text:#e8edf5;--muted:#94a3b8;
  --brand:#5b8cff;--brand-ink:#0b1120;--brand-soft:#1d2b4f;
  --ok:#4ade80;--ok-soft:#12301f;--warn:#fbbf24;--warn-soft:#3a2c0c;--bad:#f87171;--bad-soft:#3b1515;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 20px)}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top) + 14px) 16px 10px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.02em}
.logo img{width:36px;height:36px;display:block}
.sub{color:var(--muted);font-size:13px;font-weight:500}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}
.search{margin-top:12px;position:relative}
.search input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 40px 0 42px;outline:none}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search svg{position:absolute;left:13px;top:13px;width:20px;height:20px;color:var(--muted)}
.search .clear{position:absolute;right:6px;top:6px;width:34px;height:34px;border-radius:10px;color:var(--muted);display:none}
.pills{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;margin:0 -16px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;height:36px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill .n{font-size:12px;color:var(--muted);font-weight:600}
.pill.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.pill.on .n{color:inherit;opacity:.7}
main{padding:4px 16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat.warn b{color:var(--warn)}.stat.bad b{color:var(--bad)}
.sectionhd{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 10px}
.sectionhd h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.sort{background:none;border:0;color:var(--brand);font-weight:600;font-size:13px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card .main{display:flex;gap:12px;padding:12px 12px 10px;align-items:flex-start;text-align:left;width:100%}
.thumb{width:52px;height:52px;border-radius:12px;background:var(--surface2);flex:none;display:grid;place-items:center;overflow:hidden;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:26px;height:26px}
.info{flex:1;min-width:0}
.title{font-weight:650;font-size:15.5px;line-height:1.3;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;color:var(--muted);font-size:12.5px}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta svg{width:13px;height:13px}
.badge{flex:none;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.02em}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-low{background:var(--warn-soft);color:var(--warn)}.b-out{background:var(--bad-soft);color:var(--bad)}
.bar{height:4px;background:var(--surface2);margin:0 12px;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.stepper{display:grid;grid-template-columns:1fr 1fr 1.6fr 1fr 1fr;gap:6px;padding:10px 12px 12px}
.stepper button{height:44px;border-radius:12px;background:var(--surface2);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.stepper button:active{transform:scale(.96)}
.stepper .qty{background:var(--brand-soft);color:var(--brand);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.stepper .qty b{font-size:19px}
.stepper .qty small{font-size:10.5px;font-weight:600;opacity:.8}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty svg{width:56px;height:56px;opacity:.5}
.empty h3{color:var(--text);margin:10px 0 4px;font-size:17px}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px);height:56px;padding:0 22px 0 18px;border-radius:18px;background:var(--brand);color:var(--brand-ink);font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(29,78,216,.35);z-index:25}
.fab svg{width:22px;height:22px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
nav.tabs svg{width:24px;height:24px}
nav.tabs button.on{color:var(--brand)}
nav.tabs .dot{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;display:grid;place-items:center;font-weight:700}
.row{display:flex;gap:8px}
.btn{height:46px;padding:0 16px;border-radius:12px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface2)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 0;margin-bottom:14px}
.panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 16px 6px}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;border-top:1px solid var(--line)}
.panel h3+.li,.panel .li:first-child{border-top:0}
.li .ic{width:36px;height:36px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;flex:none}
.li .ic svg{width:18px;height:18px}
.li .tx{flex:1;min-width:0}.li .tx small{display:block;color:var(--muted);font-size:12.5px}
.li.red{color:var(--bad)}
.act{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act .d{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px}
.act .d.in{background:var(--ok-soft);color:var(--ok)}.act .d.out{background:var(--bad-soft);color:var(--bad)}.act .d.set{background:var(--brand-soft);color:var(--brand)}
.act .tx{flex:1;min-width:0}.act .tx b{font-weight:600}.act small{color:var(--muted);display:block;font-size:12.5px}
.daylbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 4px 8px}
.ro{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.ro:first-child{border-top:0}
.ro .tx{flex:1;min-width:0}.ro small{color:var(--muted);font-size:12.5px;display:block}
.ro .need{text-align:right;flex:none}
.ro .need b{font-size:18px;display:block;color:var(--warn);font-variant-numeric:tabular-nums}
.ro .need span{font-size:11px;color:var(--muted);font-weight:600}
.ro.out .need b{color:var(--bad)}
.callout{display:flex;gap:12px;background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:13.5px;font-weight:550}
.callout svg{width:20px;height:20px;flex:none}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(2,6,23,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:640px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;max-height:92vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px}
.sheet .hd h2{margin:0;font-size:18px;letter-spacing:-.01em}
.sheet .bd{overflow:auto;padding:6px 16px 16px}
.sheet .ft{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:650;color:var(--muted);margin:0 0 5px 2px}
.field input,.field select,.field textarea{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;outline:none}
.field textarea{height:72px;padding:10px 12px;resize:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.divider{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 2px 10px;display:flex;align-items:center;gap:8px}
.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.photo{display:flex;align-items:center;gap:12px}
.photo .thumb{width:64px;height:64px}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.segs button{height:40px;padding:0 14px;border-radius:10px;background:var(--surface2);font-weight:650}
.segs button.on{background:var(--brand);color:var(--brand-ink)}
.bigqty{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 14px}
.bigqty button{width:56px;height:56px;border-radius:16px;background:var(--surface2);font-size:24px;font-weight:700}
.bigqty input{width:120px;height:64px;text-align:center;font-size:30px;font-weight:750;border-radius:16px;border:1px solid var(--line);background:var(--bg);outline:none;font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 86px);transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 10px 10px 16px;border-radius:14px;display:flex;align-items:center;gap:14px;font-weight:600;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:.2s;width:max-content;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--brand);font-weight:750;padding:6px 10px;border-radius:8px;filter:brightness(1.4)}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;padding:6px 16px 14px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 12px;border-radius:999px;background:var(--surface2);font-weight:600;font-size:13.5px}
.chip button{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brandrow">
      <div class="logo">
        <img src="icon-192.png" alt="" width="36" height="36" style="border-radius:9px">
        <div><div id="pageTitle">Pipefitter Inventory</div><div class="sub" id="pageSub">Materials on hand</div></div>
      </div>
      <button class="iconbtn" id="themeBtn" aria-label="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
    </div>
    <div id="stockHead">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search name, size, material, bin…" autocomplete="off">
        <button class="clear" id="qClear" aria-label="Clear">✕</button>
      </div>
      <div class="pills" id="pills"></div>
    </div>
  </header>

  <main>
    <section id="v-stock">
      <div class="stats" id="stats"></div>
      <div class="sectionhd"><h2 id="listLabel">All items</h2><button class="sort" id="sortBtn">Sort: Name</button></div>
      <div class="list" id="list"></div>
    </section>
    <section id="v-reorder" class="hidden"></section>
    <section id="v-activity" class="hidden"></section>
    <section id="v-tools" class="hidden"></section>
  </main>
</div>

<button class="fab" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add item</button>

<nav class="tabs"><div class="in">
  <button data-v="stock" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>Stock</button>
  <button data-v="reorder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 002 1.6h8.2a2 2 0 002-1.5L21 8H6"/><circle cx="10" cy="20.5" r="1.2"/><circle cx="18" cy="20.5" r="1.2"/></svg>Reorder<span class="dot hidden" id="roDot"></span></button>
  <button data-v="activity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Activity</button>
  <button data-v="tools"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Tools</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="hd"><h2 id="shTitle"></h2><button class="iconbtn" id="shClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="bd" id="shBody"></div><div class="ft" id="shFoot"></div></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>
<input type="file" id="fileIn" accept="application/json,.json" class="hidden">
<input type="file" id="photoIn" accept="image/*" class="hidden">

<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ICON={
 box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>',
 pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
 tag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>',
 dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>',
 ul:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 15V3M7 8l5-5 5 5M4 20h16"/></svg>',
 grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>',
 copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 00-2-2H5a2 2 0 00-2 2v9a2 2 0 002 2h3"/></svg>',
 trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
 shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>',
 alert:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/></svg>',
 cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
 cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 4h2l2.4 11.2a2 2 0 002 1.6h8.2a2 2 0 002-1.5L21 8H6"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>',
 clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
};
// Category-aware spec labels
const SPEC={
 'Gaskets':['Pipe size','e.g. 4"','Material','e.g. 316SS / Graphite','Type / Class','e.g. Spiral Wound 150#'],
 'Bolts':['Diameter × Length','e.g. 3/4" × 4-1/2"','Grade / Coating','e.g. B7, Zinc','Type','e.g. Stud w/ 2H nuts'],
 'U-Bolts':['Pipe size','e.g. 2"','Finish','e.g. Hot-dip galv','Rod / Thread','e.g. 3/8" rod'],
 'J-Bolts':['Diameter × Length','e.g. 1/2" × 12"','Finish','e.g. Plain steel','Hook / Thread','e.g. 3" thread'],
 'Pipe Plugs':['Thread size','e.g. 1/2" NPT','Material','e.g. 316SS','Head style','e.g. Hex head'],
 'Valves':['Size','e.g. 2"','Body material','e.g. Stainless','Type / Rating','e.g. Ball, 1000 WOG']
};
const DEF_SPEC=['Size','e.g. 1"','Material','e.g. Carbon steel','Type / Rating','e.g. Standard'];
const DEF_CATS=['Gaskets','Bolts','U-Bolts','J-Bolts','Pipe Plugs','Valves'];
const UNITS=['ea','box','pack','set','ft','bag'];

let S={items:[],log:[],cats:DEF_CATS.slice(),theme:null,sort:'name',seeded:false};
let view='stock',cat='All',query='';

// ---------- Storage (IndexedDB w/ localStorage fallback) ----------
let db=null;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('ezinventory',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
function load(){return new Promise(res=>{
  if(db){const t=db.transaction('kv').objectStore('kv').get('state');t.onsuccess=()=>res(t.result||null);t.onerror=()=>res(null)}
  else{try{res(JSON.parse(localStorage.getItem('ezinventory')||'null'))}catch(e){res(null)}}
})}
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{
  if(db){db.transaction('kv','readwrite').objectStore('kv').put(S,'state')}
  else{try{localStorage.setItem('ezinventory',JSON.stringify(S))}catch(e){}}
},120)}

function seed(){
  const mk=(name,category,size,material,type,bin,qty,min,unit='ea',sku='')=>({id:uid(),name,category,size,material,type,bin,qty,min,unit,sku,notes:'',photo:'',updated:Date.now()});
  S.items=[
    mk('Spiral Wound Gasket','Gaskets','4"','316SS / Graphite','150# RF','A-1',24,10,'ea','SWG-4-150'),
    mk('B7 Stud Bolt w/ 2H Nuts','Bolts','3/4" × 4-1/2"','B7 / Zinc','Full thread','B-3',6,20,'ea','B7-34-412'),
    mk('Pipe U-Bolt','U-Bolts','2"','Hot-dip galv','3/8" rod','C-2',40,15,'ea','UB-2-HDG'),
    mk('J-Bolt Anchor','J-Bolts','1/2" × 12"','Plain steel','3" thread','C-5',0,10,'ea','JB-12-12'),
    mk('Hex Head Pipe Plug','Pipe Plugs','1/2" NPT','316SS','Hex head','D-1',18,8,'ea','PP-12-SS'),
    mk('Full Port Ball Valve','Valves','2"','Stainless','Ball, 1000 WOG','E-4',3,4,'ea','BV-2-SS')
  ];
  S.items.forEach(i=>i.sample=true);S.seeded=true;
}

// ---------- Helpers ----------
const status=i=>i.qty<=0?'out':(i.min>0&&i.qty<=i.min?'low':'ok');
const specLine=i=>[i.size,i.material,i.type].filter(Boolean).join(' · ');
const needQty=i=>Math.max((i.min||0)*2-i.qty,(i.min||0)-i.qty,1);
const lowItems=()=>S.items.filter(i=>status(i)!=='ok').sort((a,b)=>(a.qty-a.min)-(b.qty-b.min));
function fmtTime(t){const d=new Date(t);return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
function fmtDay(t){const d=new Date(t),n=new Date();const y=new Date();y.setDate(n.getDate()-1);
  if(d.toDateString()===n.toDateString())return 'Today';if(d.toDateString()===y.toDateString())return 'Yesterday';
  return d.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'})}

// ---------- Rendering ----------
function render(){
  document.documentElement.dataset.theme=S.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  ['stock','reorder','activity','tools'].forEach(v=>$('#v-'+v).classList.toggle('hidden',v!==view));
  $('#stockHead').classList.toggle('hidden',view!=='stock');
  $('#fab').classList.toggle('hidden',view!=='stock');
  const titles={stock:['Pipefitter Inventory','Materials on hand'],reorder:['Reorder','Items at or below minimum'],activity:['Activity','Check-ins, check-outs & counts'],tools:['Tools','Categories, backup & settings']};
  $('#pageTitle').textContent=titles[view][0];$('#pageSub').textContent=titles[view][1];
  const n=lowItems().length;const dot=$('#roDot');dot.textContent=n;dot.classList.toggle('hidden',!n);
  ({stock:renderStock,reorder:renderReorder,activity:renderActivity,tools:renderTools})[view]();
}

function renderStock(){
  const counts={};S.items.forEach(i=>counts[i.category]=(counts[i.category]||0)+1);
  const cats=['All',...S.cats];
  $('#pills').innerHTML=cats.map(c=>`<button class="pill ${c===cat?'on':''}" data-cat="${esc(c)}">${esc(c)}<span class="n">${c==='All'?S.items.length:(counts[c]||0)}</span></button>`).join('');
  const q=query.trim().toLowerCase();
  let items=S.items.filter(i=>(cat==='All'||i.category===cat)&&(!q||[i.name,i.size,i.material,i.type,i.bin,i.sku,i.category,i.notes].join(' ').toLowerCase().includes(q)));
  const sorters={name:(a,b)=>a.name.localeCompare(b.name),qty:(a,b)=>a.qty-b.qty,bin:(a,b)=>(a.bin||'~').localeCompare(b.bin||'~',undefined,{numeric:true}),recent:(a,b)=>b.updated-a.updated};
  items.sort(sorters[S.sort]);
  $('#sortBtn').textContent='Sort: '+{name:'Name',qty:'Quantity',bin:'Bin',recent:'Recent'}[S.sort];
  const scope=cat==='All'?S.items:S.items.filter(i=>i.category===cat);
  const low=scope.filter(i=>status(i)==='low').length,out=scope.filter(i=>status(i)==='out').length;
  $('#stats').innerHTML=`<div class="stat"><b>${scope.length}</b><span>Items</span></div><button class="stat warn" data-go="reorder"><b>${low}</b><span>Low stock</span></button><button class="stat bad" data-go="reorder"><b>${out}</b><span>Out of stock</span></button>`;
  $('#listLabel').textContent=(q?'Results':cat==='All'?'All items':cat)+` · ${items.length}`;
  $('#qClear').style.display=query?'block':'none';
  if(!items.length){
    $('#list').innerHTML=`<div class="empty">${ICON.box}<h3>${S.items.length?'No matches':'No items yet'}</h3><div>${S.items.length?'Try a different search or category.':'Tap “Add item” to log your first material.'}</div></div>`;return;
  }
  $('#list').innerHTML=items.map(card).join('');
}
function card(i){
  const st=status(i);const lbl={ok:'In stock',low:'Low',out:'Out'}[st];
  const pct=i.min>0?Math.min(100,i.qty/(i.min*2)*100):(i.qty>0?100:0);
  const col={ok:'var(--ok)',low:'var(--warn)',out:'var(--bad)'}[st];
  return `<div class="card" data-id="${i.id}">
   <button class="main" data-edit="${i.id}">
    <div class="thumb">${i.photo?`<img src="${i.photo}" alt="">`:ICON.box}</div>
    <div class="info"><div class="title">${esc(i.name)}</div>
     <div class="meta">${specLine(i)?`<span>${esc(specLine(i))}</span>`:''}</div>
     <div class="meta">${i.bin?`<span>${ICON.pin}Bin ${esc(i.bin)}</span>`:''}<span>${ICON.tag}${esc(i.category)}</span>${i.min>0?`<span>Min ${i.min}</span>`:''}</div>
    </div>
    <span class="badge b-${st}">${lbl}</span>
   </button>
   <div class="bar"><i style="width:${pct}%;background:${col}"></i></div>
   <div class="stepper">
    <button data-adj="-5">−5</button><button data-adj="-1">−1</button>
    <button class="qty" data-count="${i.id}"><b>${i.qty}</b><small>${esc(i.unit||'ea')}</small></button>
    <button data-adj="1">+1</button><button data-adj="5">+5</button>
   </div></div>`;
}

function renderReorder(){
  const items=lowItems();
  if(!items.length){$('#v-reorder').innerHTML=`<div class="empty">${ICON.check}<h3>All stocked up</h3><div>Nothing is at or below its minimum. Set a minimum on any item to track it here.</div></div>`;return}
  const out=items.filter(i=>i.qty<=0).length;
  $('#v-reorder').innerHTML=`
   <div class="callout">${ICON.alert}<div>${items.length} item${items.length>1?'s':''} need restocking${out?` — ${out} completely out`:''}. Suggested order brings each item back to 2× its minimum.</div></div>
   <div class="panel" style="padding:0">${items.map(i=>`<div class="ro ${i.qty<=0?'out':''}" data-edit="${i.id}" style="cursor:pointer">
     <div class="thumb" style="width:44px;height:44px">${i.photo?`<img src="${i.photo}" alt="">`:ICON.box}</div>
     <div class="tx"><div class="title" style="font-size:15px">${esc(i.name)}</div><small>${esc(specLine(i))}${i.bin?' · Bin '+esc(i.bin):''}</small><small>On hand <b style="color:var(--text)">${i.qty}</b> · Min ${i.min}</small></div>
     <div class="need"><b>${needQty(i)}</b><span>ORDER ${esc((i.unit||'ea').toUpperCase())}</span></div></div>`).join('')}</div>
   <div class="row"><button class="btn primary" style="flex:1" id="roCopy">${ICON.copy}Copy list</button><button class="btn" style="flex:1" id="roCsv">${ICON.dl}Export CSV</button></div>
   <button class="btn block" style="margin-top:8px" id="roShare">${ICON.ul}Share list</button>`;
}

function renderActivity(){
  if(!S.log.length){$('#v-activity').innerHTML=`<div class="empty">${ICON.clock}<h3>No activity yet</h3><div>Every check-in, check-out, and count update shows up here.</div></div>`;return}
  let html='',day='';
  S.log.slice(0,300).forEach(l=>{
    const d=fmtDay(l.t);if(d!==day){if(day)html+='</div>';html+=`<div class="daylbl">${d}</div><div class="panel" style="padding:0">`;day=d}
    const k=l.kind==='set'?'set':(l.delta>0?'in':'out');
    const sign=l.kind==='set'?'=':(l.delta>0?'+'+l.delta:l.delta);
    const verb=l.kind==='set'?'Count set':l.kind==='add'?'Added':l.kind==='del'?'Removed item':(l.delta>0?'Checked in':'Checked out');
    html+=`<div class="act"><div class="d ${k}">${sign}</div><div class="tx"><b>${esc(l.name)}</b><small>${verb} · ${l.from} → ${l.to}${l.note?' · '+esc(l.note):''}</small></div><small>${fmtTime(l.t)}</small></div>`;
  });
  $('#v-activity').innerHTML=html+'</div>';
}

function renderTools(){
  const persisted=window._persisted;
  const hasSamples=S.items.some(i=>i.sample);
  $('#v-tools').innerHTML=`
   <div class="panel"><h3>Categories</h3>
    <div class="chiprow">${S.cats.map(c=>`<span class="chip">${esc(c)}<button data-delcat="${esc(c)}" aria-label="Remove">✕</button></span>`).join('')}</div>
    <button class="li" id="addCat"><span class="ic">${ICON.grid}</span><span class="tx">Add category<small>Flanges, fittings, clamps, and more</small></span></button>
   </div>
   <div class="panel"><h3>Data</h3>
    <button class="li" id="bk"><span class="ic">${ICON.dl}</span><span class="tx">Back up inventory<small>Save a JSON file to your phone</small></span></button>
    <button class="li" id="rs"><span class="ic">${ICON.ul}</span><span class="tx">Restore from backup<small>Replace current data with a saved file</small></span></button>
    <button class="li" id="csv"><span class="ic">${ICON.grid}</span><span class="tx">Export full CSV<small>Open in Excel or Google Sheets</small></span></button>
   </div>
   <div class="panel"><h3>Device</h3>
    <div class="li"><span class="ic">${ICON.shield}</span><span class="tx">Offline storage<small>${db?'IndexedDB':'Local storage'} · ${persisted?'Protected from cleanup':'Standard (back up regularly)'} · ${S.items.length} items</small></span></div>
   </div>
   <div class="panel"><h3>Reset</h3>
    ${hasSamples?`<button class="li" id="clrS"><span class="ic">${ICON.trash}</span><span class="tx">Clear sample items<small>Keep everything you added</small></span></button>`:''}
    <button class="li red" id="rst"><span class="ic">${ICON.trash}</span><span class="tx">Reset everything<small>Delete all items and history</small></span></button>
   </div>
   <div class="sub" style="text-align:center;margin:8px 0 20px">Pipefitter Inventory · Works fully offline</div>`;
}

// ---------- Actions ----------
let undoState=null,toastT;
function toast(msg,undo){
  $('#toastMsg').textContent=msg;$('#toastUndo').classList.toggle('hidden',!undo);undoState=undo||null;
  $('#toast').classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>$('#toast').classList.remove('on'),3200);
}
function logIt(i,kind,from,to,note){S.log.unshift({t:Date.now(),id:i.id,name:i.name,kind,delta:to-from,from,to,note:note||''});if(S.log.length>1000)S.log.length=1000}
function setQty(i,to,kind,note){
  to=Math.max(0,Math.round(to));const from=i.qty;if(to===from&&kind!=='set')return;
  const prevLog=S.log.length;i.qty=to;i.updated=Date.now();logIt(i,kind||'adj',from,to,note);save();render();
  if(navigator.vibrate)navigator.vibrate(8);
  const d=to-from;
  toast(kind==='set'?`${i.name}: count set to ${to}`:`${d>0?'+':''}${d} ${i.name} → ${to}`,()=>{i.qty=from;S.log.splice(0,S.log.length-prevLog);save();render()});
  if(status(i)!=='ok'&&from>to&&(from>i.min||from>0)&&status({qty:from,min:i.min})==='ok')setTimeout(()=>toast(`${i.name} is now ${to<=0?'out of stock':'low'} — added to Reorder`),1400);
}

// sheet
function openSheet(title,body,foot){$('#shTitle').textContent=title;$('#shBody').innerHTML=body;$('#shFoot').innerHTML=foot||'';$('#shBody').scrollTop=0;$('#scrim').classList.add('on');$('#sheet').classList.add('on')}
function closeSheet(){$('#scrim').classList.remove('on');$('#sheet').classList.remove('on')}
$('#scrim').onclick=closeSheet;$('#shClose').onclick=closeSheet;

let editing=null,editPhoto='';
function openEdit(id,dupFrom){
  const src=id?S.items.find(x=>x.id===id):dupFrom;
  editing=id||null;
  const i=src?{...src}:{name:'',category:cat!=='All'?cat:S.cats[0]||'Gaskets',size:'',material:'',type:'',bin:'',sku:'',unit:'ea',qty:0,min:0,notes:'',photo:''};
  if(dupFrom){i.name=i.name+' (copy)';i.qty=0}
  editPhoto=i.photo||'';
  const sp=SPEC[i.category]||DEF_SPEC;
  openSheet(id?'Edit item':(dupFrom?'Duplicate item':'New item'),`
   <div class="field"><label>Item name</label><input id="f-name" value="${esc(i.name)}" placeholder="e.g. Spiral Wound Gasket"></div>
   <div class="grid2">
    <div class="field"><label>Category</label><select id="f-cat">${S.cats.map(c=>`<option ${c===i.category?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
    <div class="field"><label>Bin / Location</label><input id="f-bin" value="${esc(i.bin)}" placeholder="e.g. A-1"></div>
   </div>
   <div class="divider">Specs</div>
   <div class="field"><label id="l-size">${sp[0]}</label><input id="f-size" value="${esc(i.size)}" placeholder="${esc(sp[1])}"></div>
   <div class="grid2">
    <div class="field"><label id="l-mat">${sp[2]}</label><input id="f-mat" value="${esc(i.material)}" placeholder="${esc(sp[3])}"></div>
    <div class="field"><label id="l-type">${sp[4]}</label><input id="f-type" value="${esc(i.type)}" placeholder="${esc(sp[5])}"></div>
   </div>
   <div class="field"><label>Part # / SKU (optional)</label><input id="f-sku" value="${esc(i.sku)}" placeholder="e.g. SWG-4-150"></div>
   <div class="divider">Quantity</div>
   <div class="grid3">
    <div class="field"><label>On hand</label><input id="f-qty" type="number" inputmode="numeric" min="0" value="${i.qty}"></div>
    <div class="field"><label>Reorder at</label><input id="f-min" type="number" inputmode="numeric" min="0" value="${i.min||0}"></div>
    <div class="field"><label>Unit</label><select id="f-unit">${UNITS.map(u=>`<option ${u===i.unit?'selected':''}>${u}</option>`).join('')}</select></div>
   </div>
   <div class="sub" style="margin:-4px 2px 8px">Item moves to Reorder when on-hand drops to this number. Use 0 to skip.</div>
   <div class="divider">Extras</div>
   <div class="field photo"><div class="thumb" id="f-thumb">${editPhoto?`<img src="${editPhoto}">`:ICON.cam}</div>
    <div class="row"><button class="btn" id="f-photo">${editPhoto?'Change photo':'Add photo'}</button>${editPhoto?'<button class="btn" id="f-nophoto">Remove</button>':''}</div></div>
   <div class="field"><label>Notes</label><textarea id="f-notes" placeholder="Anything worth remembering">${esc(i.notes)}</textarea></div>
   ${id?`<div class="row" style="margin-top:6px"><button class="btn" style="flex:1" id="f-dup">${ICON.copy}Duplicate</button><button class="btn danger" style="flex:1" id="f-del">${ICON.trash}Delete</button></div>`:''}
  `,`<button class="btn" style="flex:1" id="f-cancel">Cancel</button><button class="btn primary" style="flex:2" id="f-save">${id?'Save changes':'Add item'}</button>`);
  $('#f-cat').onchange=e=>{const s=SPEC[e.target.value]||DEF_SPEC;[['size',0],['mat',2],['type',4]].forEach(([k,n])=>{$('#l-'+k).textContent=s[n];$('#f-'+k).placeholder=s[n+1]})};
  $('#f-photo').onclick=()=>$('#photoIn').click();
  if($('#f-nophoto'))$('#f-nophoto').onclick=()=>{editPhoto='';$('#f-thumb').innerHTML=ICON.cam;$('#f-nophoto').remove();$('#f-photo').textContent='Add photo'};
  $('#f-cancel').onclick=closeSheet;
  $('#f-save').onclick=saveEdit;
  if(id){
    $('#f-dup').onclick=()=>{const it=S.items.find(x=>x.id===id);openEdit(null,it)};
    $('#f-del').onclick=()=>{const idx=S.items.findIndex(x=>x.id===id);const it=S.items[idx];if(!confirm(`Delete “${it.name}”?`))return;
      S.items.splice(idx,1);logIt(it,'del',it.qty,0);save();closeSheet();render();toast('Item deleted',()=>{S.items.splice(idx,0,it);S.log.shift();save();render()})};
  }
  if(!id&&!dupFrom)setTimeout(()=>$('#f-name').focus(),280);
}
function saveEdit(){
  const name=$('#f-name').value.trim();if(!name){$('#f-name').focus();$('#f-name').style.borderColor='var(--bad)';return}
  const data={name,category:$('#f-cat').value,bin:$('#f-bin').value.trim(),size:$('#f-size').value.trim(),material:$('#f-mat').value.trim(),type:$('#f-type').value.trim(),sku:$('#f-sku').value.trim(),
    qty:Math.max(0,parseInt($('#f-qty').value)||0),min:Math.max(0,parseInt($('#f-min').value)||0),unit:$('#f-unit').value,notes:$('#f-notes').value.trim(),photo:editPhoto,updated:Date.now()};
  if(editing){const it=S.items.find(x=>x.id===editing);const from=it.qty;Object.assign(it,data);delete it.sample;if(from!==data.qty)logIt(it,'set',from,data.qty,'Edited');toast('Changes saved')}
  else{const it={id:uid(),...data};S.items.push(it);logIt(it,'add',0,it.qty);toast(`${name} added`)}
  save();closeSheet();render();
}
$('#photoIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
  const m=320,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);editPhoto=c.toDataURL('image/jpeg',.72);$('#f-thumb').innerHTML=`<img src="${editPhoto}">`;$('#f-photo').textContent='Change photo'};img.src=r.result};r.readAsDataURL(f);e.target.value=''};

function openCount(id){
  const i=S.items.find(x=>x.id===id);let mode='out';
  openSheet(i.name,`
   <div class="sub" style="text-align:center;margin-bottom:12px">${esc(specLine(i))}${i.bin?' · Bin '+esc(i.bin):''}<br>On hand: <b style="color:var(--text)">${i.qty} ${esc(i.unit)}</b></div>
   <div class="segs" style="justify-content:center;margin-bottom:14px"><button data-m="out" class="on">Check out</button><button data-m="in">Check in</button><button data-m="set">Set count</button></div>
   <div class="bigqty"><button id="c-m">−</button><input id="c-n" type="number" inputmode="numeric" min="0" value="1"><button id="c-p">+</button></div>
   <div class="hint" id="c-hint"></div>
   <div class="field"><label>Note / Job (optional)</label><input id="c-note" placeholder="e.g. WO-1042, Unit 3"></div>`,
   `<button class="btn" style="flex:1" id="c-cancel">Cancel</button><button class="btn primary" style="flex:2" id="c-ok">Confirm</button>`);
  const n=$('#c-n');
  const hint=()=>{const v=Math.max(0,parseInt(n.value)||0);const to=mode==='set'?v:mode==='in'?i.qty+v:Math.max(0,i.qty-v);$('#c-hint').textContent=`${i.qty} → ${to} ${i.unit}`;$('#c-ok').textContent={out:'Check out',in:'Check in',set:'Set count'}[mode]};
  document.querySelectorAll('.segs button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.segs button').forEach(x=>x.classList.toggle('on',x===b));if(mode==='set')n.value=i.qty;else n.value=1;hint()});
  $('#c-m').onclick=()=>{n.value=Math.max(0,(parseInt(n.value)||0)-1);hint()};$('#c-p').onclick=()=>{n.value=(parseInt(n.value)||0)+1;hint()};
  n.oninput=hint;hint();
  $('#c-cancel').onclick=closeSheet;
  $('#c-ok').onclick=()=>{const v=Math.max(0,parseInt(n.value)||0);const note=$('#c-note').value.trim();closeSheet();
    if(mode==='set')setQty(i,v,'set',note);else setQty(i,mode==='in'?i.qty+v:i.qty-v,'adj',note)};
}

function openReset(){
  openSheet('Reset everything',`
   <div class="callout" style="background:var(--bad-soft);color:var(--bad)">${ICON.alert}<div>This permanently deletes all ${S.items.length} item${S.items.length===1?'':'s'} and ${S.log.length} history entr${S.log.length===1?'y':'ies'}. It cannot be undone. Consider backing up first.</div></div>
   <div class="field"><label>Type <b style="color:var(--text)">Delete</b> to confirm</label><input id="r-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Delete"></div>`,
   `<button class="btn" style="flex:1" id="r-cancel">Cancel</button><button class="btn danger" style="flex:2;opacity:.45" id="r-ok" disabled>Delete everything</button>`);
  const inp=$('#r-in'),ok=$('#r-ok');
  inp.oninput=()=>{const m=inp.value.trim().toLowerCase()==='delete';ok.disabled=!m;ok.style.opacity=m?1:.45;ok.style.background=m?'var(--bad)':'';ok.style.color=m?'#fff':''};
  $('#r-cancel').onclick=closeSheet;
  ok.onclick=()=>{if(inp.value.trim().toLowerCase()!=='delete')return;S.items=[];S.log=[];S.cats=DEF_CATS.slice();cat='All';save();closeSheet();render();toast('All items and history deleted')};
  setTimeout(()=>inp.focus(),280);
}
// ---------- Export ----------
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const csvCell=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const stamp=()=>new Date().toISOString().slice(0,10);
function exportCSV(items,name,withOrder){
  const head=['Name','Category','Size','Material','Type/Rating','Bin','SKU','On Hand','Unit','Reorder At','Status'].concat(withOrder?['Order Qty']:[]).concat(['Notes']);
  const rows=items.map(i=>[i.name,i.category,i.size,i.material,i.type,i.bin,i.sku,i.qty,i.unit,i.min,{ok:'In stock',low:'Low',out:'Out'}[status(i)]].concat(withOrder?[needQty(i)]:[]).concat([i.notes]));
  download(name,[head,...rows].map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv');
}
function reorderText(){return 'Pipefitter Inventory — Reorder List ('+new Date().toLocaleDateString()+')\n\n'+lowItems().map(i=>`• ${needQty(i)} ${i.unit} — ${i.name}${specLine(i)?' ('+specLine(i)+')':''}${i.sku?' #'+i.sku:''}  [on hand ${i.qty}]`).join('\n')}

// ---------- Events ----------
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-edit]');if(!t)return;
  if(t.dataset.v){view=t.dataset.v;render();scrollTo(0,0);return}
  if(t.dataset.go){view=t.dataset.go;render();scrollTo(0,0);return}
  if(t.dataset.cat){cat=t.dataset.cat;render();return}
  if(t.dataset.adj){const id=t.closest('.card').dataset.id;const i=S.items.find(x=>x.id===id);setQty(i,i.qty+(+t.dataset.adj));return}
  if(t.dataset.count){openCount(t.dataset.count);return}
  if(t.dataset.edit){openEdit(t.dataset.edit);return}
  if(t.dataset.delcat){const c=t.dataset.delcat;const used=S.items.filter(i=>i.category===c).length;
    if(used){toast(`${used} item${used>1?'s':''} still use “${c}”`);return}
    S.cats=S.cats.filter(x=>x!==c);if(cat===c)cat='All';save();render();return}
  switch(t.id){
    case 'addCat':{const c=(prompt('New category name')||'').trim();if(c&&!S.cats.includes(c)){S.cats.push(c);save();render();toast(`Category “${c}” added`)}break}
    case 'bk':download(`pipefitter-inventory-backup-${stamp()}.json`,JSON.stringify({app:'Pipefitter Inventory',v:2,...S},null,0),'application/json');toast('Backup saved');break;
    case 'rs':$('#fileIn').click();break;
    case 'csv':exportCSV(S.items,`pipefitter-inventory-${stamp()}.csv`);break;
    case 'clrS':if(confirm('Remove the sample items?')){S.items=S.items.filter(i=>!i.sample);S.log=S.log.filter(l=>S.items.some(i=>i.id===l.id));save();render();toast('Sample items cleared')}break;
    case 'rst':openReset();break;
    case 'roCopy':navigator.clipboard?.writeText(reorderText()).then(()=>toast('Reorder list copied'),()=>toast('Copy not available'));break;
    case 'roCsv':exportCSV(lowItems(),`pipefitter-inventory-reorder-${stamp()}.csv`,true);break;
    case 'roShare':if(navigator.share)navigator.share({title:'Reorder list',text:reorderText()}).catch(()=>{});else navigator.clipboard?.writeText(reorderText()).then(()=>toast('Sharing unavailable — list copied'));break;
  }
});
$('#fab').onclick=()=>openEdit(null);
$('#q').oninput=e=>{query=e.target.value;renderStock()};
$('#qClear').onclick=()=>{query='';$('#q').value='';renderStock()};
$('#sortBtn').onclick=()=>{const o=['name','qty','bin','recent'];S.sort=o[(o.indexOf(S.sort)+1)%o.length];save();renderStock()};
$('#themeBtn').onclick=()=>{const cur=document.documentElement.dataset.theme;S.theme=cur==='dark'?'light':'dark';save();render()};
$('#toastUndo').onclick=()=>{if(undoState){undoState();undoState=null;$('#toast').classList.remove('on')}};
$('#fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.items))throw 0;
  if(!confirm(`Restore ${d.items.length} items from backup? Current data will be replaced.`))return;
  S={...S,items:d.items.map(i=>({min:0,unit:'ea',...i})),log:d.log||[],cats:d.cats||DEF_CATS.slice()};save();render();toast('Backup restored')}catch(_){toast('That file is not a valid backup')}};r.readAsText(f);e.target.value=''};

// ---------- Boot ----------
(async()=>{
  await openDB();const d=await load();
  if(d){S={...S,...d};S.items.forEach(i=>{if(i.min==null)i.min=0})}else{seed();save()}
  render();
  try{if(navigator.storage&&navigator.storage.persist){window._persisted=await navigator.storage.persisted()||await navigator.storage.persist()}}catch(e){}
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
})();
</script>
</body>
